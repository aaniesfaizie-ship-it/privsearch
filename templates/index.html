<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>PrivSearch</title>
</head>
<body>
  <h1>PrivSearch</h1>
  <p>Search privately...</p>

  <form action="/search" method="get">
    <input type="text" name="q" value="{{ query }}" placeholder="Search privately...">
    <button type="submit">Search</button>
  </form>

  {% if query %}
    <p>You searched for: <b>{{ query }}</b></p>
  {% endif %}

  {% if results %}
    <ul>
      {% for r in results %}
      <li>
        <a href="{{ r['url'] }}">{{ r['title'] }}</a>
        <form action="/save" method="post" style="display:inline">
          <input type="hidden" name="title" value="{{ r['title'] }}">
          <input type="hidden" name="url" value="{{ r['url'] }}">
          <input type="hidden" name="engine" value="{{ r['engine'] }}">
          <button type="submit">Save</button>
        </form>
      </li>
      {% endfor %}
    </ul>
  {% elif query %}
    <p>No results for "{{ query }}".</p>
  {% endif %}

  <p><a href="/saved">Saved bookmarks</a></p>
</body>
</html>
